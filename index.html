<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aris Chat AI — Умный ИИ-помощник</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon.png">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #000; --surface: #111; --sidebar: #0a0a0a; --text: #fff;
    --text-muted: #888; --border: #222; --hover: #1a1a1a; --active: #222;
  }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--bg); color: var(--text);
    height: 100vh; display: flex; overflow: hidden;
  }

  /* БОКОВАЯ ПАНЕЛЬ */
  .sidebar {
    width: 260px; background: var(--sidebar); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; padding: 15px; transition: transform 0.3s;
    z-index: 100;
  }
  .sidebar.hidden { transform: translateX(-100%); position: absolute; }
  .new-chat-btn {
    display: flex; align-items: center; gap: 10px; padding: 12px;
    border: 1px solid var(--border); border-radius: 8px; background: transparent;
    color: var(--text); font-size: 0.9rem; font-weight: 600; cursor: pointer;
    transition: background 0.2s; margin-bottom: 20px; width: 100%;
  }
  .new-chat-btn:hover { background: var(--hover); }
  .chat-history { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 5px; }
  .history-item {
    padding: 10px 12px; border-radius: 8px; font-size: 0.85rem; color: var(--text-muted);
    cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    transition: background 0.2s, color 0.2s; display: flex; justify-content: space-between;
    align-items: center; position: relative;
  }
  .history-item:hover { background: var(--hover); color: var(--text); }
  .history-item.active { background: var(--active); color: var(--text); }
  .delete-chat-btn {
    display: none; background: none; border: none; color: var(--text-muted);
    cursor: pointer; font-size: 0.9rem; padding: 2px 5px; border-radius: 4px;
  }
  .history-item:hover .delete-chat-btn { display: block; }
  .delete-chat-btn:hover { color: #ef4444; background: rgba(239, 68, 68, 0.1); }
  .sidebar-footer { border-top: 1px solid var(--border); padding-top: 15px; margin-top: 15px; }
  .user-profile {
    display: flex; align-items: center; gap: 10px; padding: 10px;
    border-radius: 8px; cursor: pointer; transition: background 0.2s;
  }
  .user-profile:hover { background: var(--hover); }
  .user-avatar {
    width: 32px; height: 32px; border-radius: 50%; background: var(--text);
    color: var(--bg); display: grid; place-items: center; font-weight: bold; font-size: 0.9rem;
  }
  .user-name { font-size: 0.9rem; font-weight: 600; }

  /* ОСНОВНАЯ ЧАСТЬ */
  .main-content { flex: 1; display: flex; flex-direction: column; position: relative; }
  .toggle-sidebar {
    position: absolute; top: 15px; left: 15px; width: 40px; height: 40px;
    border-radius: 8px; border: 1px solid var(--border); background: var(--surface);
    color: var(--text); cursor: pointer; font-size: 1.2rem; display: grid;
    place-items: center; z-index: 50;
  }
  .toggle-sidebar:hover { background: var(--hover); }
  .chat-container {
    flex: 1; overflow-y: auto; padding: 24px; padding-top: 70px;
    display: flex; flex-direction: column; gap: 20px;
  }
  .messages {
    max-width: 800px; width: 100%; margin: 0 auto;
    display: flex; flex-direction: column; gap: 24px;
  }
  .welcome-screen { text-align: center; padding: 80px 20px; color: var(--text-muted); max-width: 600px; margin: 0 auto; }
  .welcome-screen h1 { font-size: 2rem; color: var(--text); margin-bottom: 10px; font-weight: 700; }
  .welcome-screen p { font-size: 1rem; line-height: 1.6; }

  .msg { display: flex; gap: 16px; animation: slideUp 0.3s ease; }
  @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
  .msg .avatar {
    width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center;
    font-size: 1.1rem; flex-shrink: 0; background: var(--surface); border: 1px solid var(--border);
  }
  .msg.user .avatar { background: var(--text); color: var(--bg); }
  .msg.ai .avatar { background: var(--surface); }
  .msg .content { flex: 1; min-width: 0; padding-top: 6px; }
  .msg .role { font-size: .75rem; font-weight: 800; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; }
  .msg.ai .role { color: var(--text); }
  .msg .text { font-size: .95rem; line-height: 1.6; word-wrap: break-word; white-space: pre-wrap; }
  
  /* Картинки в чате */
  .msg .image-box { margin-top: 10px; border-radius: 12px; overflow: hidden; border: 1px solid var(--border); max-width: 400px; }
  .msg .image-box img { width: 100%; display: block; }
  .msg .download-link {
    display: inline-block; margin-top: 10px; padding: 8px 16px;
    background: var(--text); color: var(--bg); text-decoration: none;
    border-radius: 8px; font-size: 0.85rem; font-weight: bold;
  }

  /* Поле ввода */
  .input-container { padding: 20px 24px 30px; background: var(--bg); }
  .input-wrapper {
    max-width: 800px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end;
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
    padding: 8px 8px 8px 20px; transition: border-color 0.3s;
  }
  .input-wrapper:focus-within { border-color: var(--text); }
  .input-wrapper textarea {
    flex: 1; border: none; background: transparent; color: var(--text); font-size: 1rem;
    padding: 12px 0; outline: none; font-family: inherit; resize: none;
    max-height: 200px; min-height: 24px; line-height: 1.4;
  }
  .input-wrapper textarea::placeholder { color: #555; }
  .send-btn {
    background: var(--text); color: var(--bg); border: none; width: 40px; height: 40px;
    border-radius: 10px; cursor: pointer; font-size: 1.1rem; display: grid;
    place-items: center; transition: background 0.2s;
  }
  .send-btn:hover { background: #cccccc; }
  .send-btn:disabled { opacity: 0.3; cursor: not-allowed; }

  @media (max-width: 768px) {
    .sidebar { position: absolute; height: 100%; transform: translateX(-100%); }
    .sidebar.active { transform: translateX(0); }
    .toggle-sidebar { display: grid; }
  }
  @media (min-width: 769px) {
    .toggle-sidebar { display: none; }
  }
</style>
</head>
<body>

<div class="sidebar" id="sidebar">
  <button class="new-chat-btn" id="newChatBtn"><span>+</span> Новый чат</button>
  <div class="chat-history" id="chatHistory"></div>
  <div class="sidebar-footer">
    <div class="user-profile">
      <div class="user-avatar">Р</div>
      <div class="user-name">Ролан</div>
    </div>
  </div>
</div>

<div class="main-content">
  <button class="toggle-sidebar" id="toggleSidebar">☰</button>
  
  <div class="chat-container" id="chatContainer">
    <div class="messages" id="messages"></div>
  </div>

  <div class="input-container">
    <div class="input-wrapper">
      <textarea id="input" placeholder="Задайте вопрос или напишите: нарисуй..." rows="1"></textarea>
      <button class="send-btn" id="send">➤</button>
    </div>
  </div>
</div>

<script>
  let chats = JSON.parse(localStorage.getItem('aris_chats')) || [];
  let currentChatId = null;

  const sidebar = document.getElementById('sidebar');
  const toggleBtn = document.getElementById('toggleSidebar');
  const newChatBtn = document.getElementById('newChatBtn');
  const chatHistoryEl = document.getElementById('chatHistory');
  const chatContainer = document.getElementById('chatContainer');
  const messagesEl = document.getElementById('messages');
  const inputEl = document.getElementById('input');
  const sendBtn = document.getElementById('send');

  function saveChats() { localStorage.setItem('aris_chats', JSON.stringify(chats)); }

  function renderChatHistory() {
    chatHistoryEl.innerHTML = '';
    chats.forEach(chat => {
      const div = document.createElement('div');
      div.className = 'history-item' + (chat.id === currentChatId ? ' active' : '');
      div.innerHTML = `<span>${chat.title}</span><button class="delete-chat-btn" data-id="${chat.id}">✕</button>`;
      div.addEventListener('click', (e) => { if (!e.target.classList.contains('delete-chat-btn')) loadChat(chat.id); });
      div.querySelector('.delete-chat-btn').addEventListener('click', (e) => { e.stopPropagation(); deleteChat(chat.id); });
      chatHistoryEl.appendChild(div);
    });
  }

  function createNewChat() {
    const newChat = { id: Date.now(), title: 'Новый чат', messages: [] };
    chats.unshift(newChat);
    currentChatId = newChat.id;
    saveChats(); renderChatHistory(); renderMessages();
    inputEl.focus();
  }

  function loadChat(id) { currentChatId = id; renderChatHistory(); renderMessages(); }

  function deleteChat(id) {
    if (!confirm('Удалить этот чат?')) return;
    chats = chats.filter(c => c.id !== id);
    if (currentChatId === id) currentChatId = chats.length > 0 ? chats[0].id : null;
    saveChats(); renderChatHistory(); renderMessages();
  }

  function renderMessages() {
    messagesEl.innerHTML = '';
    const chat = chats.find(c => c.id === currentChatId);
    if (!chat || chat.messages.length === 0) {
      messagesEl.innerHTML = `<div class="welcome-screen"><h1>Чем я могу помочь?</h1><p>Задайте любой вопрос или попросите нарисовать картинку.</p></div>`;
      return;
    }
    chat.messages.forEach(msg => {
      if (msg.type === 'image') {
        const div = document.createElement('div');
        div.className = 'msg ai';
        div.innerHTML = `
          <div class="avatar">🎨</div>
          <div class="content"><div class="role">Aris Chat AI · Картинка</div>
          <div class="image-box"><img src="${msg.content}" alt="Картинка"></div>
          <a href="${msg.content}" target="_blank" class="download-link">💾 Скачать</a></div>
        `;
        messagesEl.appendChild(div);
      } else {
        const div = document.createElement('div');
        div.className = 'msg ' + msg.role;
        div.innerHTML = `
          <div class="avatar">${msg.role === 'user' ? '👤' : '🤖'}</div>
          <div class="content"><div class="role">${msg.role === 'user' ? 'Вы' : 'Aris Chat AI'}</div>
          <div class="text">${msg.content}</div></div>
        `;
        messagesEl.appendChild(div);
      }
    });
    chatContainer.scrollTop = chatContainer.scrollHeight;
  }

  function addMessageToCurrentChat(text, role, type = 'text') {
    const chat = chats.find(c => c.id === currentChatId);
    if (!chat) return;
    chat.messages.push({ role, content: text, type });
    if (role === 'user' && chat.messages.filter(m => m.role === 'user').length === 1) {
      chat.title = text.substring(0, 30) + (text.length > 30 ? '...' : '');
      renderChatHistory();
    }
    saveChats(); renderMessages();
  }

  function addTyping() {
    const div = document.createElement('div');
    div.className = 'msg ai'; div.id = 'typing';
    div.innerHTML = `<div class="avatar">🤖</div><div class="content"><div class="role">Aris Chat AI</div><div class="typing-dots"><span></span><span></span><span></span></div></div>`;
    messagesEl.appendChild(div);
    chatContainer.scrollTop = chatContainer.scrollHeight;
  }
  function removeTyping() { const t = document.getElementById('typing'); if (t) t.remove(); }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text || !currentChatId) return;

    addMessageToCurrentChat(text, 'user');
    inputEl.value = ''; inputEl.style.height = 'auto'; sendBtn.disabled = true;

    const lowerText = text.toLowerCase();
    const imageTriggers = ['нарисуй', 'сгенерируй картинку', 'покажи картинку', 'создай изображение', 'хочу картинку', 'сгенерируй фото', 'картинку', 'нарисуй мне'];
    const isImageRequest = imageTriggers.some(t => lowerText.includes(t));

    if (isImageRequest) {
      let prompt = text;
      imageTriggers.forEach(trig => { prompt = prompt.replace(new RegExp(trig, 'gi'), '').trim(); });
      if (!prompt) prompt = 'beautiful landscape';

      addTyping();
      setTimeout(() => {
        removeTyping();
        const imageUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}`;
        addMessageToCurrentChat(imageUrl, 'ai', 'image');
        sendBtn.disabled = false; inputEl.focus();
      }, 5000);
      return;
    }

    addTyping();
    try {
      const model = document.getElementById('modelSelect')?.value || 'openai';
      const url = `https://text.pollinations.ai/${encodeURIComponent(text)}?model=${model}`;
      const res = await fetch(url);
      if (!res.ok) throw new Error(res.status);
      const answer = await res.text();
      removeTyping();
      addMessageToCurrentChat(answer, 'ai');
    } catch (err) {
      removeTyping();
      addMessageToCurrentChat('⚠️ Ошибка соединения. Подождите минуту.', 'ai');
    }
    sendBtn.disabled = false; inputEl.focus();
  }

  newChatBtn.addEventListener('click', createNewChat);
  toggleBtn.addEventListener('click', () => { sidebar.classList.toggle('active'); });
  sendBtn.addEventListener('click', sendMessage);
  inputEl.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } });
  inputEl.addEventListener('input', () => { inputEl.style.height = 'auto'; inputEl.style.height = Math.min(inputEl.scrollHeight, 200) + 'px'; });

  if (chats.length === 0) createNewChat();
  else { currentChatId = chats[0].id; renderChatHistory(); renderMessages(); }
</script>
</body>
</html>
