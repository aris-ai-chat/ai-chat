<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aris Chat AI — Умный ИИ-помощник</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #09090b;
    --surface: #18181b;
    --text: #f4f4f5;
    --text-muted: #a1a1aa;
    --border: #27272a;
    --user-bg: #18181b;
    --ai-bg: #18181b;
    --accent: #06b6d4;
    --glow: 0 0 15px rgba(6, 182, 212, 0.4);
  }

  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  header {
    border-bottom: 1px solid var(--border);
    padding: 12px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    background: rgba(9, 9, 11, 0.8);
    backdrop-filter: blur(10px);
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 800;
    font-size: 1.1rem;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .logo .icon { font-size: 1.5rem; filter: drop-shadow(0 0 8px var(--accent)); }
  .logo span { color: var(--accent); text-shadow: 0 0 10px rgba(6, 182, 212, 0.5); }

  .controls { display: flex; align-items: center; gap: 10px; }

  select {
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: .85rem;
    cursor: pointer;
    outline: none;
  }

  .icon-btn {
    width: 38px;
    height: 38px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    border-radius: 8px;
    cursor: pointer;
    font-size: 1rem;
    display: grid;
    place-items: center;
    transition: all .2s;
  }

  .icon-btn:hover { border-color: var(--accent); color: var(--accent); }

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .messages { max-width: 800px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }

  .welcome { text-align: center; padding: 60px 20px; color: var(--text-muted); max-width: 600px; margin: 0 auto; }
  .welcome .big { font-size: 4rem; margin-bottom: 20px; display: block; animation: float 3s ease-in-out infinite; }
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  .welcome h2 { font-size: 1.6rem; color: var(--text); margin-bottom: 12px; font-weight: 700; }
  .welcome p { font-size: 1rem; line-height: 1.6; }

  .msg { display: flex; gap: 16px; animation: slideUp 0.3s ease; }
  @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

  .msg .avatar { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; font-size: 1.1rem; flex-shrink: 0; border: 1px solid var(--border); }
  .msg.user .avatar { background: var(--surface); }
  .msg.ai .avatar { background: rgba(6, 182, 212, 0.1); border-color: var(--accent); }

  .msg .content { flex: 1; min-width: 0; padding-top: 6px; }
  .msg .role { font-size: .75rem; font-weight: 800; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; }
  .msg.ai .role { color: var(--accent); }

  .msg .text {
    font-size: .95rem; line-height: 1.6; word-wrap: break-word; white-space: pre-wrap;
    background: var(--surface); padding: 14px 18px; border-radius: 0 12px 12px 12px; border: 1px solid var(--border); display: inline-block; max-width: 100%;
  }

  .msg.user .text { background: rgba(255, 255, 255, 0.05); border-radius: 12px 0 12px 12px; float: right; clear: both; }

  .msg .image-preview {
    max-width: 100%;
    max-height: 250px;
    border-radius: 12px;
    margin-top: 8px;
    border: 1px solid var(--border);
  }

  .typing-dots { display: inline-flex; gap: 6px; align-items: center; padding: 8px 0; }
  .typing-dots span { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: bounce 1.2s infinite; }
  .typing-dots span:nth-child(2) { animation-delay: .15s; }
  .typing-dots span:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); opacity: .4; } 30% { transform: translateY(-8px); opacity: 1; } }

  .input-area { padding: 20px 24px 30px; background: var(--bg); }
  .input-row {
    max-width: 800px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end;
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 8px; transition: all .3s;
  }
  .input-row:focus-within { border-color: var(--accent); box-shadow: 0 0 20px rgba(6, 182, 212, 0.15); }

  #uploadBtn {
    background: transparent; color: var(--text-muted); border: none; width: 44px; height: 44px;
    border-radius: 12px; cursor: pointer; font-size: 1.4rem; display: grid; place-items: center; transition: all .2s;
  }
  #uploadBtn:hover { color: var(--accent); background: rgba(6, 182, 212, 0.1); }

  #input {
    flex: 1; border: none; background: transparent; color: var(--text); font-size: 1rem;
    padding: 12px 0; outline: none; font-family: inherit; resize: none; max-height: 200px; line-height: 1.4;
  }
  #input::placeholder { color: #52525b; }

  #send {
    background: var(--accent); color: #000; border: none; width: 44px; height: 44px; border-radius: 12px;
    cursor: pointer; font-size: 1.2rem; display: grid; place-items: center; transition: all .2s; font-weight: bold;
  }
  #send:hover:not(:disabled) { background: #22d3ee; transform: scale(1.05); }
  #send:disabled { opacity: .3; cursor: not-allowed; }

  .hint { max-width: 800px; margin: 12px auto 0; font-size: .75rem; color: #52525b; text-align: center; }
</style>
</head>
<body>

<header>
  <div class="logo">
    <span class="icon">🤖</span>
    <span>Aris</span> Chat AI
  </div>
  <div class="controls">
    <select id="modelSelect">
      <option value="openai">🤖 GPT-4o mini</option>
      <option value="mistral">💨 Mistral</option>
    </select>
    <button class="icon-btn" id="clearBtn" title="Очистить чат">🗑️</button>
  </div>
</header>

<div id="chat">
  <div class="messages" id="messages">
    <div class="welcome" id="welcome">
      <span class="big">🤖</span>
      <h2>Добро пожаловать в Aris Chat AI</h2>
      <p>Задайте вопрос или отправьте фото (например, сфотографируйте задачу по математике).</p>
    </div>
  </div>
</div>

<div class="input-area">
  <div class="input-row">
    <input type="file" id="imageInput" accept="image/*" style="display: none;">
    <button id="uploadBtn" title="Прикрепить фото">📷</button>
    
    <textarea id="input" placeholder="Введите запрос или прикрепите фото..." rows="1"></textarea>
    <button id="send" title="Отправить">➤</button>
  </div>
  <div class="hint">Aris Chat AI может ошибаться. Проверяйте важную информацию.</div>
</div>

<script>
const chatEl = document.getElementById('chat');
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('send');
const modelSelect = document.getElementById('modelSelect');
const clearBtn = document.getElementById('clearBtn');
const welcomeEl = document.getElementById('welcome');
const uploadBtn = document.getElementById('uploadBtn');
const imageInput = document.getElementById('imageInput');

let selectedImageBase64 = null;

clearBtn.onclick = () => {
  if (!confirm('Очистить историю чата?')) return;
  messagesEl.innerHTML = '';
  messagesEl.appendChild(welcomeEl);
  welcomeEl.style.display = 'block';
};

uploadBtn.onclick = () => imageInput.click();

imageInput.onchange = (e) => {
  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = (event) => {
    const img = new Image();
    img.onload = () => {
      // ЖЕСТКАЯ КОМПРЕССИЯ ДЛЯ СЕРВЕРА
      const canvas = document.createElement('canvas');
      const MAX_WIDTH = 400; // Уменьшили с 800 до 400 пикселей
      let width = img.width;
      let height = img.height;

      if (width > MAX_WIDTH) {
        height = Math.round((height * MAX_WIDTH) / width);
        width = MAX_WIDTH;
      }

      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, width, height);
      
      // Качество 0.5 (50%) - картинка весит копейки
      selectedImageBase64 = canvas.toDataURL('image/jpeg', 0.5);
      
      inputEl.placeholder = "Фото готово к отправке! Напишите вопрос...";
      sendBtn.style.background = "#22c55e";
    };
    img.src = event.target.result;
  };
  reader.readAsDataURL(file);
};

async function sendMessage() {
  const text = inputEl.value.trim();
  if (!text && !selectedImageBase64) return;

  const userDiv = document.createElement('div');
  userDiv.className = 'msg user';
  userDiv.innerHTML = `
    <div class="avatar">👤</div>
    <div class="content">
      <div class="role">Вы</div>
      ${selectedImageBase64 ? `<img src="${selectedImageBase64}" class="image-preview"><br>` : ''}
      ${text ? `<div class="text">${text}</div>` : ''}
    </div>
  `;
  if (welcomeEl.style.display !== 'none') welcomeEl.style.display = 'none';
  messagesEl.appendChild(userDiv);
  chatEl.scrollTop = chatEl.scrollHeight;

  const currentImage = selectedImageBase64;
  inputEl.value = '';
  inputEl.placeholder = "Введите запрос...";
  selectedImageBase64 = null;
  sendBtn.style.background = "var(--accent)";
  sendBtn.disabled = true;

  const typingDiv = document.createElement('div');
  typingDiv.className = 'msg ai';
  typingDiv.id = 'typing';
  typingDiv.innerHTML = `
    <div class="avatar">🤖</div>
    <div class="content">
      <div class="role">Aris Chat AI</div>
      <div class="typing-dots"><span></span><span></span><span></span></div>
    </div>
  `;
  messagesEl.appendChild(typingDiv);
  chatEl.scrollTop = chatEl.scrollHeight;

  try {
    let answer = "";

    if (currentImage) {
      const prompt = text || "Реши задачу на фото или опиши картинку.";
      
      const response = await fetch('https://text.pollinations.ai/openai', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: "openai",
          messages: [
            {
              role: "user",
              content: [
                { type: "text", text: prompt },
                { type: "image_url", image_url: { url: currentImage } }
              ]
            }
          ]
        })
      });

      if (!response.ok) throw new Error('HTTP ' + response.status);
      const data = await response.json();
      answer = data.choices[0].message.content;

    } else {
      const model = modelSelect.value;
      const response = await fetch(`https://text.pollinations.ai/${encodeURIComponent(text)}?model=${model}`);
      if (!response.ok) throw new Error(response.status);
      answer = await response.text();
    }

    document.getElementById('typing').remove();
    
    const aiDiv = document.createElement('div');
    aiDiv.className = 'msg ai';
    aiDiv.innerHTML = `
      <div class="avatar">🤖</div>
      <div class="content">
        <div class="role">Aris Chat AI</div>
        <div class="text">${answer}</div>
      </div>
    `;
    messagesEl.appendChild(aiDiv);

  } catch (err) {
    document.getElementById('typing').remove();
    const errDiv = document.createElement('div');
    errDiv.className = 'msg ai';
    errDiv.innerHTML = `
      <div class="avatar">⚠️</div>
      <div class="content">
        <div class="role">Ошибка</div>
        <div class="text">Сервер не смог обработать фото. Сделайте фото еще раз (желательно ближе к тексту) или подождите минуту.</div>
      </div>
    `;
    messagesEl.appendChild(errDiv);
  }

  sendBtn.disabled = false;
  inputEl.focus();
  chatEl.scrollTop = chatEl.scrollHeight;
}

inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 200) + 'px';
});

sendBtn.onclick = sendMessage;

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(err => console.log('PWA error', err));
  });
}
</script>
</body>
</html>
