<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Chat — Duck-style</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #ffffff;
    --text: #1a1a1a;
    --text-muted: #6b7280;
    --border: #e5e7eb;
    --user-bg: #f3f4f6;
    --accent: #de5833;
  }

  html[data-theme="dark"] {
    --bg: #1a1a1a;
    --text: #f0f0f0;
    --text-muted: #9ca3af;
    --border: #333;
    --user-bg: #2a2a2a;
    --accent: #ff6b47;
  }

  body {
    font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    transition: background .2s, color .2s;
  }

  header {
    border-bottom: 1px solid var(--border);
    padding: 12px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    background: var(--bg);
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 700;
    font-size: 1.05rem;
    white-space: nowrap;
  }

  .logo .duck { font-size: 1.4rem; }
  .logo span { color: var(--accent); }

  .controls { display: flex; align-items: center; gap: 8px; }

  select {
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: .88rem;
    cursor: pointer;
    outline: none;
  }

  select:focus { border-color: var(--accent); }

  .icon-btn {
    width: 38px;
    height: 38px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    border-radius: 8px;
    cursor: pointer;
    font-size: 1rem;
    display: grid;
    place-items: center;
    transition: all .2s;
  }

  .icon-btn:hover { border-color: var(--accent); color: var(--accent); }

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 24px 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .messages {
    max-width: 800px;
    width: 100%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .welcome {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-muted);
    max-width: 600px;
    margin: 0 auto;
  }

  .welcome .big { font-size: 3.5rem; margin-bottom: 16px; display: block; }

  .welcome h2 {
    font-size: 1.5rem;
    color: var(--text);
    margin-bottom: 8px;
    font-weight: 700;
  }

  .welcome p { font-size: .95rem; line-height: 1.5; }

  .welcome .privacy {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 20px;
    padding: 6px 14px;
    background: var(--user-bg);
    border-radius: 20px;
    font-size: .82rem;
    font-weight: 600;
  }

  .msg { display: flex; gap: 12px; animation: fadeIn .25s ease; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg .avatar {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    display: grid;
    place-items: center;
    font-size: 1rem;
    flex-shrink: 0;
    font-weight: 700;
  }

  .msg.user .avatar { background: var(--user-bg); }
  .msg.ai .avatar { background: var(--accent); color: #fff; }

  .msg .content { flex: 1; min-width: 0; padding-top: 4px; }

  .msg .role {
    font-size: .78rem;
    font-weight: 700;
    color: var(--text-muted);
    margin-bottom: 4px;
    text-transform: uppercase;
    letter-spacing: .5px;
  }

  .msg .text {
    font-size: .95rem;
    line-height: 1.6;
    word-wrap: break-word;
    white-space: pre-wrap;
  }

  .typing-dots {
    display: inline-flex;
    gap: 4px;
    align-items: center;
    padding: 8px 0;
  }

  .typing-dots span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--text-muted);
    animation: bounce 1.2s infinite;
  }

  .typing-dots span:nth-child(2) { animation-delay: .15s; }
  .typing-dots span:nth-child(3) { animation-delay: .3s; }

  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: .4; }
    30% { transform: translateY(-6px); opacity: 1; }
  }

  .input-area {
    padding: 16px 20px 20px;
    background: var(--bg);
    border-top: 1px solid var(--border);
  }

  .input-row {
    max-width: 800px;
    margin: 0 auto;
    display: flex;
    gap: 8px;
    align-items: flex-end;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 6px 6px 6px 16px;
    transition: border-color .2s;
  }

  .input-row:focus-within { border-color: var(--accent); }

  #input {
    flex: 1;
    border: none;
    background: transparent;
    color: var(--text);
    font-size: .95rem;
    padding: 10px 0;
    outline: none;
    font-family: inherit;
    resize: none;
    max-height: 200px;
    min-height: 24px;
    line-height: 1.4;
  }

  #input::placeholder { color: var(--text-muted); }

  #send {
    background: var(--accent);
    color: #fff;
    border: none;
    width: 40px;
    height: 40px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 1rem;
    display: grid;
    place-items: center;
    transition: all .2s;
    flex-shrink: 0;
  }

  #send:hover:not(:disabled) { transform: scale(1.05); filter: brightness(1.1); }
  #send:disabled { opacity: .4; cursor: not-allowed; }

  .hint {
    max-width: 800px;
    margin: 8px auto 0;
    font-size: .72rem;
    color: var(--text-muted);
    text-align: center;
  }

  @media (max-width: 600px) {
    header { padding: 10px 14px; }
    .logo { font-size: .95rem; }
    select { font-size: .82rem; padding: 7px 10px; }
    #chat { padding: 16px 14px; }
    .input-area { padding: 12px 14px 16px; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <span class="duck">🦆</span>
    <span>AI</span>Chat
  </div>
  <div class="controls">
    <select id="modelSelect">
      <option value="openai">🤖 GPT-4o mini</option>
      <option value="mistral">💨 Mistral</option>
      <option value="llama">🦙 Llama 3.3</option>
    </select>
    <button class="icon-btn" id="themeBtn" title="Тема">🌙</button>
    <button class="icon-btn" id="clearBtn" title="Очистить чат">🗑️</button>
  </div>
</header>

<div id="chat">
  <div class="messages" id="messages">
    <div class="welcome" id="welcome">
      <span class="big">🦆</span>
      <h2>Привет! Чем помочь?</h2>
      <p>Я умею отвечать на вопросы и рисовать картинки. Попробуй написать: «Нарисуй кота»!</p>
    </div>
  </div>
</div>

<div class="input-area">
  <div class="input-row">
    <textarea id="input" placeholder="Задай вопрос или напиши: нарисуй кота..." rows="1"></textarea>
    <button id="send" title="Отправить">➤</button>
  </div>
</div>

<script>
const chatEl = document.getElementById('chat');
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('send');
const modelSelect = document.getElementById('modelSelect');
const themeBtn = document.getElementById('themeBtn');
const clearBtn = document.getElementById('clearBtn');
const welcomeEl = document.getElementById('welcome');
const html = document.documentElement;

// Тема
themeBtn.onclick = () => {
  const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  html.setAttribute('data-theme', next);
  themeBtn.textContent = next === 'dark' ? '☀️' : '🌙';
  localStorage.setItem('theme', next);
};
html.setAttribute('data-theme', localStorage.getItem('theme') || 'light');
themeBtn.textContent = html.getAttribute('data-theme') === 'dark' ? '☀️' : '🌙';

let history = [];

clearBtn.onclick = () => {
  if (history.length === 0) return;
  if (!confirm('Очистить историю?')) return;
  history = [];
  messagesEl.innerHTML = '';
  messagesEl.appendChild(welcomeEl);
  welcomeEl.style.display = 'block';
};

function addMessage(text, role) {
  if (welcomeEl.style.display !== 'none') welcomeEl.style.display = 'none';
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.innerHTML = `
    <div class="avatar">${role === 'user' ? '👤' : '🦆'}</div>
    <div class="content">
      <div class="role">${role === 'user' ? 'Вы' : 'AI'}</div>
      <div class="text">${text}</div>
    </div>
  `;
  messagesEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
}

function addImage(url) {
  if (welcomeEl.style.display !== 'none') welcomeEl.style.display = 'none';
  const div = document.createElement('div');
  div.className = 'msg ai';
  div.innerHTML = `
    <div class="avatar">🎨</div>
    <div class="content">
      <div class="role">AI · Картинка</div>
      <img src="${url}" style="max-width:100%; border-radius:12px; margin-top:8px;" />
    </div>
  `;
  messagesEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
}

function addTyping(text = 'AI печатает...') {
  const div = document.createElement('div');
  div.className = 'msg ai';
  div.id = 'typing';
  div.innerHTML = `
    <div class="avatar">🦆</div>
    <div class="content">
      <div class="role">AI</div>
      <div class="text" style="color:var(--text-muted); font-style:italic;">${text}</div>
    </div>
  `;
  messagesEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
}

function removeTyping() {
  const t = document.getElementById('typing');
  if (t) t.remove();
}

async function sendMessage() {
  const text = inputEl.value.trim();
  if (!text) return;

  addMessage(text, 'user');
  inputEl.value = '';
  inputEl.style.height = 'auto';
  sendBtn.disabled = true;

  const lower = text.toLowerCase();
  const isImage = lower.includes('нарисуй') || lower.includes('картинку') || lower.includes('сгенерируй');

  if (isImage) {
    let prompt = text.replace(/нарисуй|картинку|сгенерируй/gi, '').trim();
    if (!prompt) prompt = 'красивый пейзаж';
    
    addTyping('Генерирую картинку (подожди 15 секунд)...');
    
    // Ждем 15 секунд, чтобы сервер успел сгенерировать и не выдал ошибку лимита
    setTimeout(() => {
      removeTyping();
      const url = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=1024&height=1024&nologo=true&seed=${Date.now()}`;
      addImage(url);
      sendBtn.disabled = false;
    }, 15000);

  } else {
    // БЕСПЛАТНЫЙ ТЕКСТОВЫЙ API (обходит ошибку 402)
    addTyping('AI печатает...');
    const model = modelSelect.value;
    
    try {
      // Используем GET-запрос, который работает бесплатно
      const url = `https://text.pollinations.ai/${encodeURIComponent(text)}?model=${model}`;
      const res = await fetch(url);
      if (!res.ok) throw new Error(res.status);
      const answer = await res.text();
      
      removeTyping();
      addMessage(answer, 'ai');
    } catch (err) {
      removeTyping();
      addMessage('⚠️ Ошибка сервера. Попробуй сменить модель или подожди минуту.', 'ai');
    }
    sendBtn.disabled = false;
  }
  inputEl.focus();
}

inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 200) + 'px';
});

inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

sendBtn.onclick = sendMessage;
inputEl.focus();
</script>
</body>
</html>
